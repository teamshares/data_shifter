inherit_gem:
  axn: .rubocop.yml

# rubocop REPLACES arrays on inherit; merge Exclude so our local excludes add to
# (rather than clobber) axn's shared ones (vendor, node_modules, ...).
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "spec/dummy_app/**/*"

# axn's shared config sets Style/StringLiterals but not the interpolation variant,
# which defaults to single_quotes; this gem wants double quotes in both.
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# axn allows: e, on, id, if, as. io/to are local; AllowedNames is replaced (not
# merged) on inherit, so list the full intended set.
Naming/MethodParameterName:
  AllowedNames: e, on, id, if, as, io, to

Metrics/ClassLength:
  Exclude:
    - "lib/data_shifter/shift.rb"
